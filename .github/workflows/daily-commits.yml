name: Daily Contributions

on:
  schedule:
    # Every day at:
    # 10:15 AM, 3:15 PM and 7:15 PM India time
    - cron: "15 10,15,19 * * *"
      timezone: "Asia/Kolkata"

  # Lets you test manually
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add daily activity
        run: |
          echo "- $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')" >> daily-activity.md

      - name: Commit and push
        run: |
          git config user.name "NitinBharti007"
          git config user.email "jacksp198@gmail.com"

          git add daily-activity.md

          git commit -m "chore: daily activity $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M')"

          git push
