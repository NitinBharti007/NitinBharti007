name: Daily Contributions

on:
  schedule:
    # All runs are safely after UTC changes to the same calendar date as IST
    - cron: "23 7,9,11,13,15,17 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contributions-main
  cancel-in-progress: false

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "NitinBharti007"
          git config user.email "jacksp198@gmail.com"

      - name: Sync latest main
        run: |
          git pull --rebase origin main

      - name: Ensure three daily commits
        run: |
          IST_TODAY=$(TZ=Asia/Kolkata date '+%Y-%m-%d')
          UTC_TODAY=$(date -u '+%Y-%m-%d')

          echo "India date: $IST_TODAY"
          echo "GitHub UTC date: $UTC_TODAY"

          # Important:
          # Between 12:00 AM and 5:29 AM IST,
          # GitHub is still on the previous UTC date.
          if [ "$IST_TODAY" != "$UTC_TODAY" ]; then
            echo "Too early in India."
            echo "Skipping so contribution is not counted on the previous day."
            exit 0
          fi

          touch daily-activity.md

          COUNT=$(grep -c "^- ${IST_TODAY} contribution-" daily-activity.md || true)

          echo "Existing automatic commits today: $COUNT"

          if [ "$COUNT" -ge 3 ]; then
            echo "Already have 3 commits today."
            exit 0
          fi

          START=$((COUNT + 1))

          for NUMBER in $(seq "$START" 3); do
            NOW=$(TZ=Asia/Kolkata date '+%H:%M:%S %Z')

            echo "- ${IST_TODAY} contribution-${NUMBER} ${NOW}" >> daily-activity.md

            git add daily-activity.md

            git commit -m "chore: daily activity ${IST_TODAY} #${NUMBER}"

            sleep 2
          done

      - name: Push safely
        run: |
          if git diff --quiet origin/main..HEAD; then
            echo "Nothing new to push."
            exit 0
          fi

          for ATTEMPT in 1 2 3; do
            echo "Push attempt $ATTEMPT"

            git pull --rebase origin main

            if git push origin main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Push failed after 3 attempts."
          exit 1
